name: Cart reminder + Shiprocket labels

# Every 10 minutes: books Shiprocket labels for RTD / pending orders and
# sends abandoned-cart WhatsApp reminders (each reminder goes out once;
# runs in between find nothing new). Vercel's
# Hobby plan only runs its own crons once a day, which is too slow for
# cart recovery, so GitHub's scheduler does the knocking instead.
#
# Needs one repository secret, AUTOMATION_CRON_SECRET, with the same
# value as the AUTOMATION_CRON_SECRET env var in Vercel. Without it the
# job does nothing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: cart-reminder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Book Shiprocket labels
        env:
          SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://wacrm-zwrx-1.vercel.app' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "AUTOMATION_CRON_SECRET not set — skipping."
            exit 0
          fi
          curl -sS --max-time 90 \
            -H "x-cron-secret: $SECRET" \
            "$APP_URL/api/cron/shiprocket" || true

      - name: Trigger reminder run
        env:
          SECRET: ${{ secrets.AUTOMATION_CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://wacrm-zwrx-1.vercel.app' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "AUTOMATION_CRON_SECRET not set — skipping."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 90 \
            -H "x-cron-secret: $SECRET" \
            "$APP_URL/api/cron/cart-reminder"
